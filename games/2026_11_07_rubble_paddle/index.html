<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rubble Paddle</title>
<style>
  :root {
    --bg: #1c1a26; --bg2: #2a2333; --ink: #f1e8d8; --muted: #9a90a6;
    --sand: #e0cba6; --terra: #d0814f; --oxblood: #9c3f4b; --rubble: #a88a6b;
    --spark: #ffd27a; --patina: #6cb8a9; --patina-dk: #3f8073;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(42,35,51,0.88), rgba(20,18,28,0.96)); text-align: center; padding: 24px; box-sizing: border-box;
    animation: fadeIn .35s ease-out; }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0 0 14px; font-size: 38px; font-weight: 800; letter-spacing: 0.02em; color: var(--ink); }
  .overlay h1 span { color: var(--terra); }
  .overlay p { max-width: 330px; font-size: 16px; line-height: 1.5; margin: 6px 0; color: var(--muted); }
  .overlay p b { color: var(--ink); font-weight: 700; }
  #overScore { color: var(--ink); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #overBest { color: var(--spark); font-variant-numeric: tabular-nums; }
  .wall { display: grid; grid-template-columns: repeat(5, 30px); gap: 4px; margin-bottom: 22px; }
  .wall i { display: block; height: 12px; border-radius: 3px; background: var(--sand); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); }
  .wall i:nth-child(-n+5) { background: var(--oxblood); }
  .wall i:nth-child(n+6):nth-child(-n+10) { background: var(--terra); }
  .wall i.gone { visibility: hidden; }
  .wall i.drop { animation: drop 2.4s ease-in infinite; }
  .wall i.drop2 { animation-delay: 1.2s; }
  .overlay button { margin-top: 22px; font-family: var(--font); font-size: 22px; font-weight: 800; letter-spacing: 0.04em; padding: 14px 40px; min-width: 180px; min-height: 56px;
    border: 0; border-radius: 10px; background: var(--patina); color: #142421; box-shadow: 0 5px 0 var(--patina-dk);
    touch-action: manipulation; cursor: pointer; transition: transform .08s, box-shadow .08s; }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--patina-dk); }
  .overlay button:focus-visible { outline: 2px solid var(--spark); outline-offset: 4px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drop { 0%, 30% { transform: translateY(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(46px) rotate(18deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .wall i.drop { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <div class="wall" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i class="drop"></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="drop drop2"></i><i></i></div>
  <h1>Rubble <span>Paddle</span></h1>
  <p><b>Drag anywhere</b> to move your paddle and break the bricks. Broken bricks fall as rubble: catch it to grow your paddle wider, but heavier and slower.</p>
  <p><b>Flick up</b> to fire all your rubble back at the bricks. Don't let the ball fall.</p>
  <button id="startBtn">Start</button>
</div>

<div id="overScreen" class="overlay hidden">
  <h1>Game Over</h1>
  <p id="overScore"></p>
  <p id="overBest"></p>
  <button id="restartBtn">Play Again</button>
</div>

<script>
(function () {
  'use strict';

  // ---------- Tunables ----------
  var COLS = 7;
  var BRICK_H = 18;
  var BRICK_GAP = 4;
  var BRICK_TOP = 64;
  var BALL_R = 7;
  var BALL_SPEED_BASE = 240;     // px/s at t=0 (was 300 flat at level 1)
  var BALL_SPEED_RANGE = 280;    // asymptotic extra speed gained over play time
  var BALL_SPEED_TAU = 80;       // seconds; speed = BASE + RANGE*(1-exp(-t/TAU))
  var BALL_SPEED_MAX = 520;
  var PADDLE_BASE_W = 70;
  var PADDLE_H = 12;
  var PADDLE_GROW = 8;           // width added per rubble chunk
  var PADDLE_MAX_W_FRAC = 0.7;   // of screen width
  var PADDLE_FOLLOW = 26;        // follow stiffness with no rubble
  var WEIGHT_DRAG = 0.35;        // stiffness divisor per chunk held
  var RUBBLE_GRAVITY = 650;
  var SHARD_SPEED = 750;
  var FLICK_MIN_DY = 40;         // px upward
  var FLICK_MIN_V = 0.6;         // px/ms upward
  var TAP_MAX_MOVE = 12;
  var START_LIVES = 3;

  // ---------- Setup ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var startScreen = document.getElementById('startScreen');
  var overScreen = document.getElementById('overScreen');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgGrad = null;
    if (state) layoutAfterResize();
  }

  // ---------- State ----------
  var state = null; // 'start' | 'play' | 'over'
  var score, best, lives, level;
  var bricks, rubble, shards, ball, paddle;
  var flash = null; // {text, t}

  try { best = parseInt(localStorage.getItem('rubblePaddleBest') || '0', 10) || 0; } catch (e) { best = 0; }

  function paddleY() { return Math.round(H * 0.8); }

  function brickWidth() { return (W - 2 * 8 - (COLS - 1) * BRICK_GAP) / COLS; }

  function buildLevel() {
    bricks = [];
    var rows = Math.min(3 + level, 10);
    var bw = brickWidth();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < COLS; c++) {
        var hp = 1;
        if (level >= 3 && r < Math.min(level - 2, 4)) hp = 2;
        if (level >= 6 && r === 0) hp = 3;
        bricks.push({ r: r, c: c, x: 8 + c * (bw + BRICK_GAP), y: BRICK_TOP + r * (BRICK_H + BRICK_GAP), w: bw, h: BRICK_H, hp: hp, maxHp: hp });
      }
    }
    rubble = [];
    shards = [];
    resetBall();
  }

  function layoutAfterResize() {
    var bw = brickWidth();
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      b.x = 8 + b.c * (bw + BRICK_GAP);
      b.w = bw;
    }
    paddle.y = paddleY();
    paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
    paddle.tx = clamp(paddle.tx, paddle.w / 2, W - paddle.w / 2);
  }

  function resetPaddle() {
    paddle = { x: W / 2, tx: W / 2, y: paddleY(), w: PADDLE_BASE_W, load: 0 };
  }

  function resetBall() {
    ball = { x: paddle.x, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
  }

  var playT = 0; // seconds of live ball time this run
  function ballSpeed() { return Math.min(BALL_SPEED_BASE + BALL_SPEED_RANGE * (1 - Math.exp(-playT / BALL_SPEED_TAU)), BALL_SPEED_MAX); }

  function startGame() {
    score = 0; lives = START_LIVES; level = 1; playT = 0;
    resetPaddle();
    buildLevel();
    flash = { text: 'Level 1', t: 1.2 };
    state = 'play';
    fxReset(); ensureAudio();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('rubblePaddleBest', String(best)); } catch (e) {} }
    document.getElementById('overScore').textContent = 'Score: ' + score + '  (Level ' + level + ')';
    document.getElementById('overBest').textContent = 'Best: ' + best;
    overScreen.classList.remove('hidden');
  }

  function launchBall() {
    if (!ball.stuck) return;
    var s = ballSpeed();
    var ang = (-90 + (Math.random() * 30 - 15)) * Math.PI / 180;
    ball.vx = Math.cos(ang) * s;
    ball.vy = Math.sin(ang) * s;
    ball.stuck = false;
    fxLaunch();
  }

  function fireVolley() {
    var n = paddle.load;
    if (n <= 0) return;
    fxVolley(n);
    for (var i = 0; i < n; i++) {
      var fx = n === 1 ? 0.5 : i / (n - 1);
      shards.push({ x: paddle.x - paddle.w / 2 + 6 + fx * (paddle.w - 12), y: paddle.y - 6, w: 8, h: 10 });
    }
    paddle.load = 0;
    paddle.w = PADDLE_BASE_W;
    paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
    paddle.tx = clamp(paddle.tx, paddle.w / 2, W - paddle.w / 2);
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- Input (pointer events: touch + mouse parity) ----------
  var activeId = null;
  var lastX = 0, downX = 0, downY = 0, moved = 0;
  var hist = []; // recent {y, t} samples for flick velocity

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state !== 'play') return;
    if (activeId !== null) return;
    activeId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    lastX = downX = e.clientX;
    downY = e.clientY;
    moved = 0;
    hist = [{ y: e.clientY, t: performance.now() }];
  });

  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activeId || state !== 'play') return;
    e.preventDefault();
    var dx = e.clientX - lastX;
    lastX = e.clientX;
    moved = Math.max(moved, Math.abs(e.clientX - downX), Math.abs(e.clientY - downY));
    paddle.tx = clamp(paddle.tx + dx, paddle.w / 2, W - paddle.w / 2);
    var now = performance.now();
    hist.push({ y: e.clientY, t: now });
    while (hist.length > 2 && now - hist[0].t > 120) hist.shift();
  });

  function endPointer(e, cancelled) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    if (state !== 'play' || cancelled) return;
    var now = performance.now();
    var totalDy = e.clientY - downY;
    var totalDx = e.clientX - downX;
    var v = 0;
    if (hist.length) {
      var h0 = hist[0];
      var dt = Math.max(now - h0.t, 1);
      v = (h0.y - e.clientY) / dt; // positive = upward
    }
    var isFlick = (-totalDy) > FLICK_MIN_DY && v > FLICK_MIN_V && Math.abs(totalDy) > Math.abs(totalDx);
    if (isFlick) {
      if (ball.stuck) launchBall();
      fireVolley();
    } else if (moved < TAP_MAX_MOVE) {
      launchBall();
    }
  }
  canvas.addEventListener('pointerup', function (e) { endPointer(e, false); });
  canvas.addEventListener('pointercancel', function (e) { endPointer(e, true); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ---------- Physics helpers ----------
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = clamp(cx, rx, rx + rw);
    var ny = clamp(cy, ry, ry + rh);
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function hitBrick(b, byShard) {
    b.hp--;
    if (b.hp <= 0) {
      var idx = bricks.indexOf(b);
      if (idx >= 0) bricks.splice(idx, 1);
      score += byShard ? 20 : 10;
      rubble.push({ x: b.x + b.w / 2 - 7, y: b.y + b.h / 2 - 4, w: 14, h: 8, vy: 0 });
      fxBreak(b, byShard);
    } else {
      score += 2;
      fxChip(b);
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (flash) { flash.t -= dt; if (flash.t <= 0) flash = null; }

    // Paddle follows target; heavier = slower.
    var k = PADDLE_FOLLOW / (1 + WEIGHT_DRAG * paddle.load);
    paddle.x += (paddle.tx - paddle.x) * (1 - Math.exp(-k * dt));
    paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);

    // Ball
    if (ball.stuck) {
      ball.x = paddle.x;
      ball.y = paddle.y - BALL_R - 1;
    } else {
      playT += dt;
      var speed = Math.hypot(ball.vx, ball.vy);
      var steps = Math.max(1, Math.ceil(speed * dt / 4));
      var sdt = dt / steps;
      for (var s = 0; s < steps && !ball.stuck; s++) stepBall(sdt);
    }

    // Rubble falling
    var pRect = { x: paddle.x - paddle.w / 2, y: paddle.y, w: paddle.w, h: PADDLE_H };
    var maxW = W * PADDLE_MAX_W_FRAC;
    for (var i = rubble.length - 1; i >= 0; i--) {
      var c = rubble[i];
      c.vy += RUBBLE_GRAVITY * dt;
      c.y += c.vy * dt;
      if (c.vy > 0 && rectsOverlap(c, pRect)) {
        rubble.splice(i, 1);
        paddle.load++;
        paddle.w = Math.min(paddle.w + PADDLE_GROW, maxW);
        paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
        paddle.tx = clamp(paddle.tx, paddle.w / 2, W - paddle.w / 2);
        score += 1;
        fxCatch();
      } else if (c.y > H) {
        rubble.splice(i, 1);
      }
    }

    // Shards flying up
    for (var j = shards.length - 1; j >= 0; j--) {
      var sh = shards[j];
      sh.y -= SHARD_SPEED * dt;
      var hit = false;
      for (var bi = bricks.length - 1; bi >= 0; bi--) {
        if (rectsOverlap(sh, bricks[bi])) { hitBrick(bricks[bi], true); hit = true; break; }
      }
      if (hit || sh.y + sh.h < 0) shards.splice(j, 1);
    }

    // Level clear
    if (bricks.length === 0) {
      score += 100 * level;
      level++;
      flash = { text: 'Level ' + level, t: 1.2 };
      fxLevel();
      buildLevel();
    }
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Paddle
    var px = paddle.x - paddle.w / 2;
    if (ball.vy > 0 && circleRect(ball.x, ball.y, BALL_R, px, paddle.y, paddle.w, PADDLE_H) && ball.y < paddle.y + PADDLE_H / 2) {
      var off = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
      var ang = (-90 + off * 60) * Math.PI / 180;
      var s = ballSpeed();
      ball.vx = Math.cos(ang) * s;
      ball.vy = Math.sin(ang) * s;
      ball.y = paddle.y - BALL_R - 0.5;
      fxPaddle();
    }

    // Bricks (first hit only per substep)
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (circleRect(ball.x, ball.y, BALL_R, b.x, b.y, b.w, b.h)) {
        var overL = ball.x + BALL_R - b.x;
        var overR = b.x + b.w - (ball.x - BALL_R);
        var overT = ball.y + BALL_R - b.y;
        var overB = b.y + b.h - (ball.y - BALL_R);
        var minX = Math.min(overL, overR);
        var minY = Math.min(overT, overB);
        if (minX < minY) {
          if (overL < overR) { ball.vx = -Math.abs(ball.vx); ball.x = b.x - BALL_R; }
          else { ball.vx = Math.abs(ball.vx); ball.x = b.x + b.w + BALL_R; }
        } else {
          if (overT < overB) { ball.vy = -Math.abs(ball.vy); ball.y = b.y - BALL_R; }
          else { ball.vy = Math.abs(ball.vy); ball.y = b.y + b.h + BALL_R; }
        }
        hitBrick(b, false);
        break;
      }
    }

    // Prevent near-horizontal stalls
    var sp = Math.hypot(ball.vx, ball.vy);
    if (Math.abs(ball.vy) < sp * 0.25) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * sp * 0.25;
      ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(sp * sp - ball.vy * ball.vy);
    }

    // Fell out
    if (ball.y - BALL_R > H) loseLife();
  }

  function loseLife() {
    lives--;
    rubble = [];
    shards = [];
    var keepX = paddle.x;
    resetPaddle();
    paddle.x = paddle.tx = clamp(keepX, paddle.w / 2, W - paddle.w / 2);
    resetBall();
    fxLose();
    if (lives <= 0) { gameOver(); return; }
    flash = { text: 'Ball lost! ' + lives + ' left', t: 1.2 };
  }

  // ---------- Cosmetic FX (no gameplay effect) ----------
  var PAL = {
    bg: '#1c1a26', bg2: '#2a2333', ink: '#f1e8d8', muted: '#9a90a6',
    rubble: '#a88a6b', rubbleDk: '#7d654e', spark: '#ffd27a',
    patina: '#6cb8a9', patinaDk: '#3f8073', ball: '#f6efe2', danger: '#e0606c'
  };
  var HP_COLORS = ['#e0cba6', '#e0cba6', '#d0814f', '#9c3f4b'];
  var FONT = 'ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif';
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var parts = [], trail = [], shake = 0, hurt = 0, volleyGlow = 0, catchPop = 0, clock = 0, bgGrad = null;
  var audio = null;

  function ensureAudio() {
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }
  function beep(freq, dur, type, vol, slide) {
    if (!audio) return;
    try {
      var t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function addShake(a) { if (!reduceMotion) shake = Math.min(shake + a, 10); }
  function burst(x, y, color, n, spd) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, s: 2 + Math.random() * 3, life: 0.5 + Math.random() * 0.3, t: 0, c: color });
    }
  }
  function fxReset() { parts = []; trail = []; shake = 0; hurt = 0; volleyGlow = 0; catchPop = 0; }
  function fxBreak(b, byShard) {
    burst(b.x + b.w / 2, b.y + b.h / 2, HP_COLORS[Math.min(b.maxHp, 3)], 7, 140);
    if (byShard) burst(b.x + b.w / 2, b.y + b.h, PAL.spark, 4, 120);
    addShake(byShard ? 1.5 : 2);
    beep(byShard ? 660 : 440 + Math.random() * 60, 0.07, 'square', 0.035);
  }
  function fxChip(b) { b.fxHit = 0.12; burst(b.x + b.w / 2, b.y + b.h, PAL.ink, 3, 80); beep(300, 0.05, 'triangle', 0.04); }
  function fxCatch() { catchPop = 1; beep(180, 0.06, 'triangle', 0.06, 0.7); }
  function fxPaddle() { beep(250, 0.06, 'sine', 0.07, 1.4); }
  function fxLaunch() { beep(520, 0.08, 'sine', 0.05, 1.5); }
  function fxVolley(n) {
    volleyGlow = 1; addShake(2 + Math.min(n, 12) * 0.4);
    burst(paddle.x, paddle.y, PAL.spark, Math.min(6 + n, 24), 180);
    beep(220, 0.25, 'sawtooth', 0.05, 4);
  }
  function fxLose() {
    hurt = 1; addShake(9);
    burst(ball.x, H - 4, PAL.danger, 14, 220);
    beep(200, 0.45, 'sawtooth', 0.06, 0.25);
  }
  function fxLevel() { beep(523, 0.1, 'square', 0.04); setTimeout(function () { beep(784, 0.18, 'square', 0.04); }, 110); }

  function fxUpdate(dt) {
    clock += dt;
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t >= p.life) parts.splice(i, 1);
    }
    if (parts.length > 220) parts.splice(0, parts.length - 220);
    shake = Math.max(0, shake - dt * 30);
    hurt = Math.max(0, hurt - dt * 1.6);
    volleyGlow = Math.max(0, volleyGlow - dt * 3);
    catchPop = Math.max(0, catchPop - dt * 6);
    if (bricks) for (var j = 0; j < bricks.length; j++) if (bricks[j].fxHit) bricks[j].fxHit = Math.max(0, bricks[j].fxHit - dt);
    if (ball && !ball.stuck && state === 'play') { trail.push({ x: ball.x, y: ball.y }); if (trail.length > 8) trail.shift(); }
    else trail.length = 0;
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function hash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

  // ---------- Render ----------
  function render() {
    if (!bgGrad) { bgGrad = ctx.createLinearGradient(0, 0, 0, H); bgGrad.addColorStop(0, PAL.bg2); bgGrad.addColorStop(1, PAL.bg); }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    if (!bricks) return;

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);

    // Danger line hint below paddle
    ctx.fillStyle = 'rgba(224,96,108,' + (0.05 + hurt * 0.35) + ')';
    ctx.fillRect(0, H - 3, W, 3);

    // Bricks: slab with bottom shade, cracks when damaged
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      ctx.fillStyle = b.fxHit ? PAL.ink : HP_COLORS[Math.min(b.hp, 3)];
      roundRect(b.x, b.y, b.w, b.h, 3); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(b.x + 1, b.y + b.h - 4, b.w - 2, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 2);
      if (b.hp < b.maxHp) {
        ctx.strokeStyle = 'rgba(20,16,26,0.55)'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        var cx = b.x + b.w * (0.3 + hash(b.r * 9 + b.c) * 0.4);
        ctx.moveTo(cx, b.y + 1); ctx.lineTo(cx + 4, b.y + b.h * 0.5); ctx.lineTo(cx - 2, b.y + b.h - 2);
        if (b.maxHp - b.hp > 1) { ctx.moveTo(cx + 4, b.y + b.h * 0.5); ctx.lineTo(cx + 12, b.y + b.h * 0.35); }
        ctx.stroke();
      }
    }

    // Falling rubble: tumbling chunks
    for (var j = 0; j < rubble.length; j++) {
      var c = rubble[j];
      ctx.save();
      ctx.translate(c.x + c.w / 2, c.y + c.h / 2);
      ctx.rotate(c.y * 0.02);
      ctx.fillStyle = PAL.rubble; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.fillStyle = PAL.rubbleDk; ctx.fillRect(-c.w / 2, c.h / 2 - 3, c.w, 3);
      ctx.restore();
    }

    // Particles
    for (var q = 0; q < parts.length; q++) {
      var pt = parts[q];
      ctx.globalAlpha = 1 - pt.t / pt.life;
      ctx.fillStyle = pt.c;
      ctx.fillRect(pt.x - pt.s / 2, pt.y - pt.s / 2, pt.s, pt.s);
    }
    ctx.globalAlpha = 1;

    // Shards with streak trails
    for (var k = 0; k < shards.length; k++) {
      var s = shards[k];
      var g = ctx.createLinearGradient(0, s.y, 0, s.y + 34);
      g.addColorStop(0, 'rgba(255,210,122,0.55)'); g.addColorStop(1, 'rgba(255,210,122,0)');
      ctx.fillStyle = g; ctx.fillRect(s.x + 1, s.y + s.h - 2, s.w - 2, 34);
      ctx.fillStyle = PAL.spark;
      ctx.beginPath(); ctx.moveTo(s.x + s.w / 2, s.y - 3); ctx.lineTo(s.x + s.w, s.y + s.h); ctx.lineTo(s.x, s.y + s.h); ctx.closePath(); ctx.fill();
    }

    // Paddle: belly sags with load (top edge = collision line stays flat)
    var px = paddle.x - paddle.w / 2, pw = paddle.w, py = paddle.y;
    var sag = Math.min(paddle.load * 0.5, 6);
    if (volleyGlow > 0) {
      ctx.strokeStyle = 'rgba(255,210,122,' + volleyGlow + ')';
      ctx.lineWidth = 2;
      var gx = (1 - volleyGlow) * 10;
      roundRect(px - 3 - gx, py - 3 - gx, pw + 6 + gx * 2, PADDLE_H + sag + 6 + gx * 2, 8); ctx.stroke();
    }
    ctx.fillStyle = PAL.patinaDk;
    ctx.beginPath();
    ctx.moveTo(px + 4, py); ctx.lineTo(px + pw - 4, py);
    ctx.quadraticCurveTo(px + pw, py, px + pw, py + 4);
    ctx.lineTo(px + pw, py + PADDLE_H - 3);
    ctx.quadraticCurveTo(px + pw / 2, py + PADDLE_H + sag * 2, px, py + PADDLE_H - 3);
    ctx.lineTo(px, py + 4); ctx.quadraticCurveTo(px, py, px + 4, py);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.patina;
    roundRect(px, py, pw, PADDLE_H - 4, 4); ctx.fill();

    // Rubble load piled on top as uneven chunks
    if (paddle.load > 0) {
      var n = paddle.load;
      var slot = pw / n;
      var pop = catchPop * 2;
      for (var m = 0; m < n; m++) {
        var hgt = 3 + hash(m + 1) * 3 + (m === n - 1 ? pop : 0);
        var cw = Math.max(slot - 1.5, 2);
        ctx.fillStyle = m % 2 ? PAL.rubbleDk : PAL.rubble;
        ctx.fillRect(px + m * slot + 0.75, py - hgt, cw, hgt);
      }
    }

    // Ball with soft trail
    for (var tI = 0; tI < trail.length; tI++) {
      var tp = trail[tI], f = (tI + 1) / (trail.length + 1);
      ctx.fillStyle = 'rgba(246,239,226,' + (f * 0.22) + ')';
      ctx.beginPath(); ctx.arc(tp.x, tp.y, BALL_R * (0.4 + f * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = PAL.ball;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    // Life-lost vignette
    if (hurt > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(224,96,108,0)'); vg.addColorStop(1, 'rgba(224,96,108,' + (hurt * 0.4) + ')');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }

    // HUD (top)
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = PAL.muted;
    ctx.fillText('SCORE', 12, 10);
    ctx.fillText('BEST ' + best, 12, 40);
    ctx.font = '800 18px ' + FONT;
    ctx.fillStyle = PAL.ink;
    ctx.fillText(String(score), 12, 22);

    ctx.textAlign = 'center';
    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = PAL.muted;
    ctx.fillText('LEVEL ' + level, W / 2, 10);
    ctx.font = '800 16px ' + FONT;
    ctx.fillStyle = paddle.load > 0 ? PAL.spark : PAL.muted;
    ctx.fillText('■ ' + paddle.load + ' rubble', W / 2, 24);

    // Lives as chalk dots
    ctx.textAlign = 'right';
    ctx.font = '600 11px ' + FONT;
    ctx.fillStyle = PAL.muted;
    ctx.fillText('LIVES', W - 12, 10);
    for (var L = 0; L < START_LIVES; L++) {
      ctx.fillStyle = L < lives ? PAL.ball : 'rgba(154,144,166,0.3)';
      ctx.beginPath(); ctx.arc(W - 18 - L * 16, 31, 5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var pulse = 0.6 + 0.4 * Math.sin(clock * 4);
    if (ball.stuck && state === 'play') {
      ctx.globalAlpha = pulse;
      ctx.fillStyle = PAL.ink;
      ctx.font = '700 16px ' + FONT;
      ctx.fillText('Tap to launch', W / 2, paddle.y + 40);
      ctx.globalAlpha = 1;
    } else if (paddle.load > 0 && state === 'play') {
      ctx.fillStyle = PAL.spark;
      ctx.globalAlpha = 0.85;
      ctx.font = '700 14px ' + FONT;
      ctx.fillText('↑ Flick up to fire ' + paddle.load + ' rubble', W / 2, paddle.y + 40);
      ctx.globalAlpha = 1;
    }
    if (flash && state === 'play') {
      var ft = Math.min(1, flash.t / 0.3);
      var grow = 1 + Math.max(0, flash.t - 0.9) * 0.6;
      ctx.save();
      ctx.globalAlpha = ft;
      ctx.translate(W / 2, H * 0.55);
      ctx.scale(grow, grow);
      ctx.font = '800 30px ' + FONT;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillText(flash.text, 0, 3);
      ctx.fillStyle = /lost/.test(flash.text) ? PAL.danger : PAL.ink;
      ctx.fillText(flash.text, 0, 0);
      ctx.restore();
    }
  }

  // ---------- Loop ----------
  var lastT = performance.now();
  function frame(t) {
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    if (state === 'play') update(dt);
    fxUpdate(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  state = 'start';
  resetPaddle();
  level = 1; score = 0; lives = START_LIVES;
  buildLevel();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
