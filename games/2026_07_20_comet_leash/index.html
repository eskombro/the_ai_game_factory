<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Comet Leash</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070a18;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // ---- Palette (presentation only) ----
  var C_BG_TOP   = '#0b1030';
  var C_BG_BOT   = '#070a18';
  var C_INK      = '#eef4ff';
  var C_MUTED    = '#8b98bd';
  var C_CYAN     = '#6fe3ff';
  var C_CYAN_DIM = '#3a4560';
  var C_GOLD     = '#ffd257';
  var C_CORAL    = '#ff4d6d';
  var C_COMET    = '#eaf6ff';
  var FONT = '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

  var bgStars = [];

  function makeBgStars() {
    bgStars = [];
    var n = Math.floor((W * H) / 9000);
    for (var i = 0; i < n; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.4 + Math.random() * 1.1,
        a: 0.15 + Math.random() * 0.5,
        tw: 0.5 + Math.random() * 2.5,  // twinkle speed
        ph: Math.random() * Math.PI * 2 // twinkle phase
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeBgStars();
    // Keep entities reachable if the viewport changed (e.g. rotation).
    if (comet) {
      comet.x = Math.min(Math.max(comet.x, comet.r), W - comet.r);
      comet.y = Math.min(Math.max(comet.y, comet.r), H - comet.r);
    }
    if (star) {
      star.x = Math.min(Math.max(star.x, 20), W - 20);
      star.y = Math.min(Math.max(star.y, 60), H - 20);
    }
  }

  // ---- Tunable constants (balance pass: adjust these) ----
  var PULL_ACCEL = 950;        // px/s^2 toward finger while leashing
  var DRAG = 0.55;             // velocity damping per second
  var MAX_SPEED = 720;         // px/s cap on comet speed
  var WALL_BOUNCE = 0.75;      // velocity retained on wall bounce

  var TETHER_MAX = 100;
  var TETHER_DRAIN = 32;       // per second while pulling (~3.1 s of continuous pull)
  var TETHER_REGEN = 28;       // per second while coasting
  var TETHER_RECOVER = 18;     // must refill to this after full depletion
  var STAR_TETHER_BONUS = 26;  // tether refill per star collected

  var COMET_R = 14;
  var STAR_R = 13;
  var MINE_R = 12;

  var MINE_BASE_COUNT = 1;     // mines on screen at score 0
  var MINE_COUNT_PER = 4;      // +1 mine per this many stars (8 mines at score 28)
  var MINE_COUNT_MAX = 8;
  var MINE_BASE_SPEED = 55;    // px/s
  var MINE_SPEED_PER = 6.5;    // +this per star collected (cap hit at score ~28)
  var MINE_SPEED_MAX = 235;
  var MINE_SPAWN_GAP = 0.9;    // seconds between spawns
  var FIRST_MINE_DELAY = 2.2;  // calm grace period before the first mine spawns

  var LIVES_START = 3;
  var INVULN_TIME = 2.0;       // seconds of invulnerability after a hit
  var RESTART_LOCK = 0.6;      // seconds before game-over screen accepts a tap
  // --------------------------------------------------------

  var state;        // 'ready' | 'playing' | 'gameover'
  var comet = null, star = null, mines, score, lives, tether, depleted, invuln, spawnTimer, gameOverAt;
  var best = 0;
  try { best = parseInt(localStorage.getItem('comet_leash_best') || '0', 10) || 0; } catch (e) {}

  var finger = { active: false, id: -1, x: 0, y: 0 };

  // ---- Cosmetic FX state (presentation only) ----
  var fx = {
    shake: 0,          // screen shake intensity (px)
    flash: 0,          // red hit-flash alpha
    burn: 0,           // leash burn-out flash timer
    pop: 0,            // star pickup ring pulse timer
    popX: 0, popY: 0,  // where the last star was grabbed
    particles: [],     // {x,y,vx,vy,life,max,r,color}
    trailT: 0          // trail emission accumulator
  };

  function spawnBurst(x, y, color, n, speed) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = speed * (0.3 + Math.random() * 0.7);
      fx.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.55, max: 0.55,
        r: 1.5 + Math.random() * 2.5,
        color: color
      });
    }
  }

  function updateFx(dt) {
    fx.shake = Math.max(0, fx.shake - 22 * dt);
    fx.flash = Math.max(0, fx.flash - 2.2 * dt);
    fx.burn  = Math.max(0, fx.burn - 1.6 * dt);
    fx.pop   = Math.max(0, fx.pop - 2.4 * dt);
    for (var i = fx.particles.length - 1; i >= 0; i--) {
      var p = fx.particles[i];
      p.life -= dt;
      if (p.life <= 0) { fx.particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= (1 - 3 * dt);
      p.vy *= (1 - 3 * dt);
    }
    // Comet trail while moving (coast or pull)
    if (state === 'playing' && comet) {
      var sp = Math.hypot(comet.vx, comet.vy);
      if (sp > 60) {
        fx.trailT += dt * Math.min(sp / 120, 4);
        while (fx.trailT > 0.14) {
          fx.trailT -= 0.14;
          fx.particles.push({
            x: comet.x + (Math.random() - 0.5) * 6,
            y: comet.y + (Math.random() - 0.5) * 6,
            vx: -comet.vx * 0.06, vy: -comet.vy * 0.06,
            life: 0.5, max: 0.5,
            r: 2 + Math.random() * 3,
            color: C_CYAN
          });
        }
      }
    }
  }
  // -----------------------------------------------

  window.addEventListener('resize', resize);
  resize();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnStar() {
    var m = 40;
    var tries = 0, x, y;
    do {
      x = rand(m, W - m);
      y = rand(m + 60, H - m); // keep clear of HUD strip
      tries++;
    } while (tries < 20 && Math.hypot(x - comet.x, y - comet.y) < 120);
    star = { x: x, y: y, r: STAR_R };
  }

  function mineTargetCount() {
    return Math.min(MINE_BASE_COUNT + Math.floor(score / MINE_COUNT_PER), MINE_COUNT_MAX);
  }
  function mineSpeed() {
    return Math.min(MINE_BASE_SPEED + score * MINE_SPEED_PER, MINE_SPEED_MAX);
  }

  function spawnMine() {
    var edge = Math.floor(rand(0, 4)); // 0 top, 1 right, 2 bottom, 3 left
    var x, y;
    if (edge === 0) { x = rand(0, W); y = -MINE_R * 2; }
    else if (edge === 1) { x = W + MINE_R * 2; y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = H + MINE_R * 2; }
    else { x = -MINE_R * 2; y = rand(0, H); }
    // Aim at a random point in the central region so paths vary.
    var tx = rand(W * 0.2, W * 0.8);
    var ty = rand(H * 0.25, H * 0.8);
    var d = Math.hypot(tx - x, ty - y) || 1;
    var sp = mineSpeed() * rand(0.8, 1.15);
    mines.push({ x: x, y: y, vx: (tx - x) / d * sp, vy: (ty - y) / d * sp, r: MINE_R });
  }

  function reset() {
    comet = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: COMET_R };
    mines = [];
    score = 0;
    lives = LIVES_START;
    tether = TETHER_MAX;
    depleted = false;
    invuln = 0;
    spawnTimer = FIRST_MINE_DELAY;
    spawnStar();
    fx.particles.length = 0;
    fx.shake = fx.flash = fx.burn = fx.pop = 0;
  }

  function startGame() {
    reset();
    state = 'playing';
  }

  function endGame() {
    state = 'gameover';
    gameOverAt = performance.now();
    if (score > best) {
      best = score;
      try { localStorage.setItem('comet_leash_best', String(best)); } catch (e) {}
    }
  }

  // ---- Input: pointer events only (touch-first) ----
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'ready') {
      startGame();
    } else if (state === 'gameover') {
      if (performance.now() - gameOverAt < RESTART_LOCK * 1000) return; // ignore stray taps
      startGame();
      finger.active = false; // drop any stale finger from before game over
    }
    if (finger.active) return; // first finger only
    var p = pointerPos(e);
    finger.active = true;
    finger.id = e.pointerId;
    finger.x = p.x;
    finger.y = p.y;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!finger.active || e.pointerId !== finger.id) return;
    e.preventDefault();
    var p = pointerPos(e);
    finger.x = p.x;
    finger.y = p.y;
  });

  function releaseFinger(e) {
    if (finger.active && e.pointerId === finger.id) {
      finger.active = false;
      finger.id = -1;
    }
  }
  canvas.addEventListener('pointerup', releaseFinger);
  canvas.addEventListener('pointercancel', releaseFinger);

  // Belt-and-braces: stop iOS scroll/zoom gestures.
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---- Update ----
  function update(dt) {
    var pulling = finger.active && !depleted && tether > 0;

    if (pulling) {
      var dx = finger.x - comet.x;
      var dy = finger.y - comet.y;
      var d = Math.hypot(dx, dy);
      if (d > 2) {
        comet.vx += (dx / d) * PULL_ACCEL * dt;
        comet.vy += (dy / d) * PULL_ACCEL * dt;
      }
      tether -= TETHER_DRAIN * dt;
      if (tether <= 0) { tether = 0; depleted = true; fx.burn = 1; /* cosmetic */ }
    } else {
      tether = Math.min(TETHER_MAX, tether + TETHER_REGEN * dt);
      if (depleted && tether >= TETHER_RECOVER) depleted = false;
    }

    // Drag + speed cap
    var damp = Math.max(0, 1 - DRAG * dt);
    comet.vx *= damp;
    comet.vy *= damp;
    var sp = Math.hypot(comet.vx, comet.vy);
    if (sp > MAX_SPEED) {
      comet.vx = comet.vx / sp * MAX_SPEED;
      comet.vy = comet.vy / sp * MAX_SPEED;
    }

    comet.x += comet.vx * dt;
    comet.y += comet.vy * dt;

    // Wall bounce
    if (comet.x < comet.r) { comet.x = comet.r; comet.vx = Math.abs(comet.vx) * WALL_BOUNCE; }
    if (comet.x > W - comet.r) { comet.x = W - comet.r; comet.vx = -Math.abs(comet.vx) * WALL_BOUNCE; }
    if (comet.y < comet.r) { comet.y = comet.r; comet.vy = Math.abs(comet.vy) * WALL_BOUNCE; }
    if (comet.y > H - comet.r) { comet.y = H - comet.r; comet.vy = -Math.abs(comet.vy) * WALL_BOUNCE; }

    // Star pickup
    if (Math.hypot(star.x - comet.x, star.y - comet.y) < star.r + comet.r) {
      // cosmetic: pickup pop at the star's position
      fx.pop = 1; fx.popX = star.x; fx.popY = star.y;
      spawnBurst(star.x, star.y, C_GOLD, 14, 220);
      score++;
      tether = Math.min(TETHER_MAX, tether + STAR_TETHER_BONUS);
      spawnStar();
    }

    // Mines
    spawnTimer -= dt;
    if (mines.length < mineTargetCount() && spawnTimer <= 0) {
      spawnMine();
      spawnTimer = MINE_SPAWN_GAP;
    }

    var margin = MINE_R * 4;
    for (var i = mines.length - 1; i >= 0; i--) {
      var m = mines[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      // Remove once well offscreen (heading out)
      if ((m.x < -margin && m.vx < 0) || (m.x > W + margin && m.vx > 0) ||
          (m.y < -margin && m.vy < 0) || (m.y > H + margin && m.vy > 0)) {
        mines.splice(i, 1);
        continue;
      }
      if (invuln <= 0 && Math.hypot(m.x - comet.x, m.y - comet.y) < m.r + comet.r) {
        // cosmetic: hit feedback
        fx.shake = 9; fx.flash = 0.45;
        spawnBurst(m.x, m.y, C_CORAL, 16, 260);
        mines.splice(i, 1);
        lives--;
        if (lives <= 0) { endGame(); return; }
        invuln = INVULN_TIME;
      }
    }

    if (invuln > 0) invuln -= dt;
  }

  // ---- Draw ----
  function drawStarShape(x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + (rot || 0) + i * Math.PI / 5;
      var rr = (i % 2 === 0) ? r : r * 0.45;
      var px = x + Math.cos(ang) * rr;
      var py = y + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    var t = performance.now() / 1000;

    // Background: soft vertical gradient + twinkling starfield
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C_BG_TOP);
    g.addColorStop(1, C_BG_BOT);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var b = 0; b < bgStars.length; b++) {
      var s = bgStars[b];
      var tw = 0.6 + 0.4 * Math.sin(t * s.tw + s.ph);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = C_INK;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'ready') {
      drawCenterText([
        ['COMET LEASH', 34, C_INK, C_CYAN],
        ['', 16],
        ['Hold anywhere: your comet is', 16, C_MUTED],
        ['pulled toward your finger.', 16, C_MUTED],
        ['Pulling drains the leash meter;', 16, C_MUTED],
        ['release to recharge while coasting.', 16, C_MUTED],
        ['', 16],
        ['Grab gold stars. Dodge red mines.', 16, C_INK],
        ['', 16],
        ['Tap to start', 20, C_GOLD]
      ], t);
      return;
    }

    // Screen shake (cosmetic offset for world layer)
    var shx = 0, shy = 0;
    if (fx.shake > 0.1) {
      shx = (Math.random() - 0.5) * 2 * fx.shake;
      shy = (Math.random() - 0.5) * 2 * fx.shake;
    }
    ctx.save();
    ctx.translate(shx, shy);

    // Leash line + finger marker
    var pulling = finger.active && !depleted && tether > 0;
    if (finger.active && state === 'playing') {
      if (pulling) {
        ctx.strokeStyle = C_CYAN;
        ctx.shadowColor = C_CYAN;
        ctx.shadowBlur = 8;
        ctx.setLineDash([6, 8]);
        ctx.lineDashOffset = -t * 60; // energy flowing toward the finger
      } else {
        ctx.strokeStyle = C_CYAN_DIM;
        ctx.setLineDash([2, 10]);
      }
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(comet.x, comet.y);
      ctx.lineTo(finger.x, finger.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Finger ring, breathing gently while pulling
      var ringR = 18 + (pulling ? Math.sin(t * 6) * 2 : 0);
      ctx.beginPath();
      ctx.arc(finger.x, finger.y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Particles (trail, bursts)
    for (var p = 0; p < fx.particles.length; p++) {
      var pt = fx.particles[p];
      var a = Math.max(0, pt.life / pt.max);
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Star pickup ring pulse
    if (fx.pop > 0) {
      var pr = (1 - fx.pop) * 42 + 10;
      ctx.globalAlpha = fx.pop * 0.9;
      ctx.strokeStyle = C_GOLD;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(fx.popX, fx.popY, pr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Star: warm glow + slow spin + gentle bob
    var bob = Math.sin(t * 2.4) * 2;
    ctx.shadowColor = C_GOLD;
    ctx.shadowBlur = 16;
    ctx.fillStyle = C_GOLD;
    drawStarShape(star.x, star.y + bob, star.r + 4, t * 0.8);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Mines: coral glow ring, dark core, slow pulse
    for (var i = 0; i < mines.length; i++) {
      var m = mines[i];
      var pulse = 1 + Math.sin(t * 5 + i * 1.7) * 0.08;
      ctx.shadowColor = C_CORAL;
      ctx.shadowBlur = 12;
      ctx.fillStyle = C_CORAL;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#5c1020';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * 0.45 * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    // Comet: icy core with cyan halo (blink while invulnerable)
    var visible = invuln <= 0 || Math.floor(invuln * 10) % 2 === 0;
    if (visible) {
      ctx.shadowColor = C_CYAN;
      ctx.shadowBlur = 18;
      ctx.fillStyle = C_COMET;
      ctx.beginPath();
      ctx.arc(comet.x, comet.y, comet.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // bright core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(comet.x, comet.y, comet.r * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore(); // end shake

    // Red hit flash (vignette-style)
    if (fx.flash > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      vg.addColorStop(0, 'rgba(255,77,109,0)');
      vg.addColorStop(1, 'rgba(255,77,109,' + (fx.flash * 0.7).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- HUD ----
    // Score (top-left): small star glyph + count
    ctx.fillStyle = C_GOLD;
    drawStarShape(22, 21, 9, 0);
    ctx.fill();
    ctx.fillStyle = C_INK;
    ctx.font = '600 17px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(score), 38, 22);

    // Lives (top-right): comet pips
    for (var L = 0; L < LIVES_START; L++) {
      var lx = W - 16 - L * 20;
      if (L < lives) {
        ctx.fillStyle = C_COMET;
        ctx.beginPath();
        ctx.arc(lx, 21, 6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = C_CYAN_DIM;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(lx, 21, 6, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Tether bar (rounded, glowing; the core mechanic — keep it loud)
    var bw = Math.min(220, W - 24);
    var bx = (W - bw) / 2, by = 36, bh = 10;
    var frac = tether / TETHER_MAX;
    // track
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundedRect(bx, by, bw, bh, bh / 2);
    ctx.fill();
    // fill: cyan when healthy, gold when low, dim coral when burned out
    var burnFlicker = fx.burn > 0 && Math.floor(t * 12) % 2 === 0;
    var barColor = depleted ? (burnFlicker ? C_CORAL : '#7a2436') : (frac < 0.3 ? C_GOLD : C_CYAN);
    if (frac > 0.02) {
      ctx.fillStyle = barColor;
      ctx.shadowColor = barColor;
      ctx.shadowBlur = depleted ? 0 : 8;
      roundedRect(bx + 1, by + 1, (bw - 2) * frac, bh - 2, (bh - 2) / 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    // label
    ctx.fillStyle = depleted ? C_CORAL : C_MUTED;
    ctx.font = (depleted ? '700 ' : '500 ') + '11px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(depleted ? 'LEASH BURNED OUT — coast to recover' : 'leash', W / 2, by + bh + 5);

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(7,10,24,0.78)';
      ctx.fillRect(0, 0, W, H);
      drawCenterText([
        ['GAME OVER', 32, C_CORAL],
        ['', 14],
        ['Stars collected: ' + score, 20, C_INK],
        ['Best: ' + best, 16, C_MUTED],
        ['', 14],
        ['Tap to play again', 18, C_GOLD]
      ], t);
    }
  }

  // lines: [text, size, color?, glowColor?]
  function drawCenterText(lines, t) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var total = 0;
    for (var i = 0; i < lines.length; i++) total += lines[i][1] + 8;
    var y = H / 2 - total / 2;
    for (var j = 0; j < lines.length; j++) {
      var size = lines[j][1];
      y += size / 2;
      if (lines[j][0]) {
        var isTap = lines[j][0].indexOf('Tap to') === 0;
        var alpha = isTap ? 0.65 + 0.35 * Math.sin((t || 0) * 3) : 1;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = lines[j][2] || C_INK;
        if (lines[j][3]) {
          ctx.shadowColor = lines[j][3];
          ctx.shadowBlur = 18;
        }
        ctx.font = (size >= 20 ? '800 ' : '500 ') + size + 'px ' + FONT;
        ctx.fillText(lines[j][0], W / 2, y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
      y += size / 2 + 8;
    }
  }

  // ---- Main loop ----
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    if (state === 'playing') update(dt);
    updateFx(dt); // cosmetic only
    draw();
    requestAnimationFrame(frame);
  }

  state = 'ready';
  reset(); // pre-populate so draw() has valid objects even on 'ready'
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
