<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The AI Game Factory</title>
<style>
  :root {
    --bg: #0a0a0d;
    --panel: #17171d;
    --border: #2a2a33;
    --border-hover: #3d3d4a;
    --text: #eaeaef;
    --muted: #93939f;
    --accent: #8b7cff;
    --accent-2: #5ee6d8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    /* 100vh is unreliable on mobile browsers with a collapsible address bar --
       it's often the *largest* possible viewport, taller than what's actually
       visible. 100dvh reflects the real visible area; browsers that don't
       support it just ignore that declaration and keep the 100vh fallback. */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  /* The iframe always gets the full viewport -- exactly what every game was
     already built and QA'd against -- rather than sharing space with a bar.
     The rating control below is a floating overlay instead, so it never
     displaces the game and can't push it into overflow on short screens. */
  iframe {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #overlay {
    position: fixed;
    right: 0.75rem;
    bottom: 0.75rem;
    z-index: 10;
    text-align: right;
  }
  #overlayToggle {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: rgba(23, 17, 29, 0.82);
    border: 1px solid var(--border);
    color: var(--accent-2);
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #overlayToggle:hover {
    border-color: var(--border-hover);
  }
  #overlayPanel {
    position: absolute;
    right: 0;
    bottom: 52px;
    width: 220px;
    max-width: calc(100vw - 1.5rem);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem;
    box-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.65);
    text-align: left;
  }
  #overlayPanel[hidden] {
    display: none;
  }
  #overlayPanel a.back {
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    margin-bottom: 0.6rem;
    transition: color 0.15s ease;
  }
  #overlayPanel a.back:hover {
    color: var(--text);
  }
  #overlayPanel h1 {
    font-size: 0.88rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #stars {
    display: flex;
    gap: 0.15rem;
  }
  #stars button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.35rem;
    line-height: 1;
    color: var(--border-hover);
    padding: 0.15rem;
    transition: color 0.1s ease, transform 0.1s ease;
  }
  #stars button:hover {
    color: var(--accent-2);
    transform: scale(1.15);
  }
  #stars button.filled {
    color: var(--accent);
  }
  #stars[data-locked="true"] button {
    cursor: default;
  }
  #ratingStats {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div id="status">Loading game…</div>
  <iframe id="gameFrame" title="" style="display:none"></iframe>

  <div id="overlay">
    <button id="overlayToggle" type="button" aria-expanded="false" aria-controls="overlayPanel" aria-label="Game info and rating">★</button>
    <div id="overlayPanel" hidden>
      <a class="back" href="index.html">← All games</a>
      <h1 id="gameTitle">Loading…</h1>
      <div id="stars" role="radiogroup" aria-label="Rate this game" data-locked="true"></div>
      <span id="ratingStats"></span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var GAMES_API_URL = "https://ai-game-factory-api.sjimenezre.workers.dev";
  var STORAGE_PREFIX = "gameSpringRated_";

  var params = new URLSearchParams(location.search);
  var slug = params.get("slug");

  var titleEl = document.getElementById("gameTitle");
  var statusEl = document.getElementById("status");
  var frameEl = document.getElementById("gameFrame");
  var starsEl = document.getElementById("stars");
  var statsEl = document.getElementById("ratingStats");
  var toggleEl = document.getElementById("overlayToggle");
  var panelEl = document.getElementById("overlayPanel");

  var STAR_COUNT = 5;
  for (var i = 1; i <= STAR_COUNT; i++) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.value = String(i);
    btn.setAttribute("aria-label", i + " star" + (i > 1 ? "s" : ""));
    btn.textContent = "★";
    starsEl.appendChild(btn);
  }

  function setPanelOpen(open) {
    panelEl.hidden = !open;
    toggleEl.setAttribute("aria-expanded", open ? "true" : "false");
  }

  toggleEl.addEventListener("click", function () {
    setPanelOpen(panelEl.hidden);
  });

  function paintStars(filled) {
    Array.prototype.forEach.call(starsEl.children, function (btn) {
      var v = parseInt(btn.dataset.value, 10);
      btn.classList.toggle("filled", v <= filled);
    });
  }

  function renderStats(stats) {
    if (!stats || stats.count === 0) {
      statsEl.textContent = "No ratings yet";
    } else {
      statsEl.textContent = "★ " + stats.avg.toFixed(1) + " (" + stats.count + ")";
    }
  }

  function lockStars(locked) {
    starsEl.dataset.locked = locked ? "true" : "false";
  }

  function alreadyRatedValue() {
    try { return localStorage.getItem(STORAGE_PREFIX + slug); } catch (e) { return null; }
  }

  function markRated(value) {
    try { localStorage.setItem(STORAGE_PREFIX + slug, String(value)); } catch (e) {}
  }

  function submitRating(value) {
    fetch(GAMES_API_URL + "/ratings/" + encodeURIComponent(slug), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: value })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        renderStats(data);
        if (data.accepted) {
          markRated(value);
          paintStars(value);
          lockStars(true);
        }
      })
      .catch(function () {});
  }

  Array.prototype.forEach.call(starsEl.children, function (btn) {
    btn.addEventListener("mouseenter", function () {
      if (starsEl.dataset.locked === "true") return;
      paintStars(parseInt(btn.dataset.value, 10));
    });
    btn.addEventListener("mouseleave", function () {
      if (starsEl.dataset.locked === "true") return;
      paintStars(parseInt(alreadyRatedValue() || "0", 10));
    });
    btn.addEventListener("click", function () {
      if (starsEl.dataset.locked === "true") return;
      submitRating(parseInt(btn.dataset.value, 10));
    });
  });

  if (!slug) {
    titleEl.textContent = "Game not found";
    statusEl.textContent = "No game specified.";
    return;
  }

  var priorRating = alreadyRatedValue();
  if (priorRating) {
    paintStars(parseInt(priorRating, 10));
    lockStars(true);
  } else {
    lockStars(false);
  }

  fetch(GAMES_API_URL + "/games")
    .then(function (res) { return res.json(); })
    .then(function (games) {
      var game = (games || []).filter(function (g) { return g.slug === slug; })[0];
      if (!game) {
        titleEl.textContent = "Game not found";
        statusEl.textContent = "Couldn't find that game.";
        return;
      }
      titleEl.textContent = game.title;
      document.title = game.title + " — The AI Game Factory";
      frameEl.title = game.title;
      frameEl.src = game.path;
      frameEl.style.display = "block";
      statusEl.style.display = "none";
    })
    .catch(function () {
      titleEl.textContent = "Game not found";
      statusEl.textContent = "Couldn't load the game list right now — please try refreshing.";
    });

  fetch(GAMES_API_URL + "/ratings")
    .then(function (res) { return res.json(); })
    .then(function (ratings) {
      renderStats((ratings && ratings[slug]) || { avg: null, count: 0 });
    })
    .catch(function () {
      statsEl.textContent = "";
    });
})();
</script>
</body>
</html>
