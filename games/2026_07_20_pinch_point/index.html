<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pinch Point</title>
<style>
  :root {
    --bg-deep: #060314;
    --bg-mid: #13123a;
    --mint: #6dfad0;
    --mint-deep: #189a82;
    --gold: #ffcf6b;
    --gold-deep: #ff9a3d;
    --violet: #b98bff;
    --violet-deep: #7a4fe0;
    --coral: #ff6b95;
    --coral-deep: #ff3d5e;
    --text: #f6f2ff;
    --text-dim: rgba(246, 242, 255, 0.62);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top)) 16px 0;
    pointer-events: none;
  }
  .hud-pill {
    background: linear-gradient(135deg, rgba(19, 18, 58, 0.68), rgba(9, 8, 28, 0.6));
    border: 1px solid rgba(185, 139, 255, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 8px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.4px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }
  #scoreLine {
    font-size: 19px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255, 207, 107, 0.45);
  }
  #bestLine {
    font-size: 12px;
    color: var(--violet);
    margin-top: 2px;
    opacity: 0.85;
  }
  #overlay {
    position: fixed;
    left: 0; right: 0; top: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text);
    background: radial-gradient(circle at 50% 38%, rgba(35, 24, 66, 0.94), rgba(5, 4, 16, 0.97));
    padding: 20px;
    box-sizing: border-box;
    transition: opacity 0.2s ease;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 32px;
    margin: 0 0 12px 0;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(120deg, var(--mint), var(--gold) 55%, var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay p {
    font-size: 16px;
    line-height: 1.55;
    max-width: 340px;
    margin: 6px 0;
    color: rgba(246, 242, 255, 0.85);
  }
  #overlayText2 {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 12px;
    letter-spacing: 0.3px;
  }
  #restartBtn {
    margin-top: 20px;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 34px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--gold), var(--coral-deep));
    color: #2a0a12;
    touch-action: manipulation;
    box-shadow: 0 6px 22px rgba(255, 154, 61, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #restartBtn.hidden { display: none; }
  #restartBtn:active {
    transform: scale(0.95);
    box-shadow: 0 3px 12px rgba(255, 154, 61, 0.25);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="hud-pill">
    <div id="scoreLine">Score: 0</div>
    <div id="bestLine">Best: 0</div>
  </div>
</div>

<div id="overlay">
  <h1 id="overlayTitle">Pinch Point</h1>
  <p id="overlayText">
    Press and drag up or down to move.<br>
    Drag right to grow, left to shrink.<br>
    Squeeze through every gap without touching a wall.
  </p>
  <p id="overlayText2">Touch or click anywhere to begin.</p>
  <button id="restartBtn" class="hidden">Play Again</button>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");
  var overlayText2 = document.getElementById("overlayText2");
  var restartBtn = document.getElementById("restartBtn");
  var scoreLine = document.getElementById("scoreLine");
  var bestLine = document.getElementById("bestLine");

  var width = 0, height = 0;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    blob.x = width * 0.28;
    blob.y = clamp(blob.y, blob.r, height - blob.r);
    updateBgGradients(); // cosmetic only
  }

  // ---- constants (mechanics-only baseline; balancing pass will tune) ----
  var BLOB_MIN_R = 14;
  var BLOB_MAX_R = 55;
  var BLOB_START_R = 26;

  var GATE_WIDTH = 56;
  var GATE_SPEED_START = 140;   // px/s
  var GATE_SPEED_MAX = 380;     // px/s
  var SPAWN_INTERVAL_START = 1.8; // s
  var SPAWN_INTERVAL_MIN = 1.0;   // s
  var GAP_HALF_MAX_START = 120;
  var GAP_HALF_MAX_END = 75;
  var GAP_HALF_MIN_START = 75;
  var GAP_HALF_MIN_END = 42;
  var RAMP_SECONDS = 75; // time to reach full difficulty

  var GAP_EDGE_MARGIN = 16; // keep gaps away from screen edges

  // ---- state ----
  var blob = { x: 0, y: 0, r: BLOB_START_R };
  var gates = [];
  var score = 0;
  var best = 0;
  try {
    var storedBest = window.localStorage && window.localStorage.getItem("pinchPointBest");
    if (storedBest) best = parseInt(storedBest, 10) || 0;
  } catch (e) { /* localStorage unavailable, ignore */ }

  var elapsed = 0;
  var spawnTimer = 1.5; // short delay before first gate
  var gameState = "start"; // "start" | "playing" | "over"

  // ---- purely cosmetic state (visuals/juice only; never read by game logic) ----
  var bgGradient = null;
  var vignetteGradient = null;
  var particles = [];
  var shakeTime = 0, shakeDur = 0, shakeMag = 0;
  var shakeOffX = 0, shakeOffY = 0;
  var cosmeticTime = 0; // clock for slow drifting background motion only

  // Distant drifting color orbs + twinkling dots for background depth/variety.
  // Positions stored as fractions of width/height so they stay put across resizes.
  // Purely decorative: drawn first, behind everything, never read by game logic.
  // Cosmetic-only gate wall color variety: each gate is randomly assigned one of
  // these gradient pairs at spawn time (in spawnGate, see `paletteIdx`), purely for
  // visual variety — geometry, collision, and scoring never read this value.
  var GATE_COLOR_PALETTES = [
    ["#ff3d5e", "#ff8f6b", "rgba(255, 77, 109, 0.4)"],
    ["#ff6b3d", "#ffcf6b", "rgba(255, 154, 61, 0.4)"],
    ["#c73dff", "#ff6b95", "rgba(199, 61, 255, 0.35)"]
  ];
  var ORB_PALETTE = ["#7a4fe0", "#189a82", "#ff9a3d", "#c77dff"];
  var orbs = [];
  (function initOrbs() {
    for (var i = 0; i < 4; i++) {
      orbs.push({
        fx: 0.15 + Math.random() * 0.7,
        fy: 0.1 + Math.random() * 0.8,
        r: 90 + Math.random() * 140,
        color: ORB_PALETTE[i % ORB_PALETTE.length],
        speed: 0.02 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2
      });
    }
  })();
  var STAR_COUNT = 46;
  var stars = [];
  (function initStars() {
    for (var i = 0; i < STAR_COUNT; i++) {
      stars.push({
        fx: Math.random(),
        fy: Math.random(),
        r: 0.6 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.1,
        warm: Math.random() < 0.35
      });
    }
  })();

  var audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { /* audio unavailable, ignore */ }
    return audioCtx;
  }
  function beep(freq, dur, type, vol) {
    var ac = ensureAudio();
    if (!ac) return;
    try {
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      var t0 = ac.currentTime;
      gain.gain.setValueAtTime(vol || 0.06, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch (e) { /* ignore */ }
  }

  function triggerShake(mag, dur) {
    shakeMag = mag;
    shakeDur = dur;
    shakeTime = dur;
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 50 + Math.random() * 170;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        age: 0,
        life: 0.45 + Math.random() * 0.4,
        r: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  function updateCosmetics(dt) {
    cosmeticTime += dt;
    if (shakeTime > 0) {
      shakeTime = Math.max(0, shakeTime - dt);
      var amt = shakeDur > 0 ? shakeMag * (shakeTime / shakeDur) : 0;
      shakeOffX = (Math.random() * 2 - 1) * amt;
      shakeOffY = (Math.random() * 2 - 1) * amt;
    } else {
      shakeOffX = 0;
      shakeOffY = 0;
    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.93;
      p.vy *= 0.93;
    }
  }

  function updateBgGradients() {
    // Layered, multi-hue backdrop: a warm violet glow near the blob's home
    // lane blending into a cooler teal midtone and a near-black indigo edge,
    // rather than a single dark-teal wash — adds depth/variety at a glance.
    bgGradient = ctx.createRadialGradient(
      width * 0.28, height * 0.42, 20,
      width * 0.28, height * 0.42, Math.max(width, height) * 0.95
    );
    bgGradient.addColorStop(0, "#2c1f52");
    bgGradient.addColorStop(0.35, "#182050");
    bgGradient.addColorStop(0.68, "#0e1a3a");
    bgGradient.addColorStop(1, "#060314");

    vignetteGradient = ctx.createRadialGradient(
      width / 2, height / 2, height * 0.32,
      width / 2, height / 2, height * 0.8
    );
    vignetteGradient.addColorStop(0, "rgba(0,0,0,0)");
    vignetteGradient.addColorStop(1, "rgba(4,2,12,0.5)");
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // Cosmetic-only helper: blend two hex colors for the blob's size-linked hue
  // shift (rendering never feeds back into game state).
  function lerpColor(hexA, hexB, t) {
    var a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
    var ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    var br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    var r = Math.round(lerp(ar, br, t)), g = Math.round(lerp(ag, bg, t)), bl = Math.round(lerp(ab, bb, t));
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function difficultyT() {
    // Raw progress toward the ramp cap, then smoothstep-eased (3t^2 - 2t^3)
    // so difficulty rises gently at first (easy, low-pressure opening),
    // accelerates through the middle, and eases into the plateau at the
    // cap instead of hitting it with an abrupt linear "kink".
    var raw = clamp(elapsed / RAMP_SECONDS, 0, 1);
    return raw * raw * (3 - 2 * raw);
  }

  // ---- input handling ----
  // A single continuous pointer (one finger, or one held mouse button) drives
  // both axes of control at once:
  //   - blob.y always follows the pointer's current vertical position.
  //   - blob.r follows the horizontal offset between the pointer's current X
  //     and the X where the current press started: dragging right grows the
  //     blob toward BLOB_MAX_R, dragging left shrinks it toward BLOB_MIN_R,
  //     and zero horizontal offset leaves the blob at whatever size it was
  //     when the press began (the neutral baseline resets on every new press).
  // Touch and mouse both funnel through pointerDown/updatePointer/pointerUp
  // so the two input paths can never diverge.
  var pointerActive = false;
  var pointerStartX = 0;
  var pointerStartR = BLOB_START_R;
  var SIZE_DRAG_RANGE = 0.35; // fraction of screen width for a full min<->max swing

  function pointerDown(x, y) {
    pointerActive = true;
    pointerStartX = x;
    pointerStartR = blob.r;
    updatePointer(x, y);
  }

  function updatePointer(x, y) {
    if (gameState !== "playing") return;
    blob.y = clamp(y, blob.r, height - blob.r);
    var range = Math.max(1, width * SIZE_DRAG_RANGE);
    var t = clamp((x - pointerStartX) / range, -1, 1);
    blob.r = (t >= 0) ? lerp(pointerStartR, BLOB_MAX_R, t) : lerp(pointerStartR, BLOB_MIN_R, -t);
  }

  function pointerUp() {
    pointerActive = false;
  }

  function touchPoint(t) {
    var rect = canvas.getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  var activeTouchId = null; // identifier of the single touch currently driving the blob

  // The overlay sits on top of the canvas, so it must handle the very first
  // tap itself (a canvas listener would never see it). Only reacts on the
  // "start" state so it doesn't swallow taps on the "Play Again" button,
  // which is handled by restartBtn's own click listener below.
  function onOverlayTouchStart(e) {
    if (gameState !== "start") return;
    e.preventDefault();
    ensureAudio(); // unlock WebAudio on first touch (cosmetic sound only)
    startGame();
    var t = e.changedTouches[0];
    activeTouchId = t.identifier;
    var p = touchPoint(t);
    pointerDown(p.x, p.y);
  }

  function onOverlayMouseDown(e) {
    if (gameState !== "start") return;
    ensureAudio();
    startGame();
    var rect = canvas.getBoundingClientRect();
    pointerDown(e.clientX - rect.left, e.clientY - rect.top);
  }

  function onCanvasTouchStart(e) {
    if (gameState !== "playing" || activeTouchId !== null) return; // ignore extra fingers
    e.preventDefault();
    var t = e.changedTouches[0];
    activeTouchId = t.identifier;
    var p = touchPoint(t);
    pointerDown(p.x, p.y);
  }

  function onTouchMove(e) {
    if (activeTouchId === null) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === activeTouchId) {
        e.preventDefault();
        var p = touchPoint(t);
        updatePointer(p.x, p.y);
        break;
      }
    }
  }

  function onTouchEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === activeTouchId) {
        activeTouchId = null;
        pointerUp();
        break;
      }
    }
  }

  overlay.addEventListener("touchstart", onOverlayTouchStart, { passive: false });
  overlay.addEventListener("mousedown", onOverlayMouseDown);
  canvas.addEventListener("touchstart", onCanvasTouchStart, { passive: false });
  // touchmove/touchend are tracked on window (like mousemove/mouseup below) so the
  // drag keeps working even if the finger moves off whichever element it started on.
  window.addEventListener("touchmove", onTouchMove, { passive: false });
  window.addEventListener("touchend", onTouchEnd, { passive: false });
  window.addEventListener("touchcancel", onTouchEnd, { passive: false });

  // Mouse drag: a single held button, using the exact same pointerDown/updatePointer
  // logic as a single finger above so both input paths behave identically.
  canvas.addEventListener("mousedown", function (e) {
    if (gameState !== "playing") return;
    var rect = canvas.getBoundingClientRect();
    pointerDown(e.clientX - rect.left, e.clientY - rect.top);
  });
  window.addEventListener("mousemove", function (e) {
    if (!pointerActive) return;
    var rect = canvas.getBoundingClientRect();
    updatePointer(e.clientX - rect.left, e.clientY - rect.top);
  });
  window.addEventListener("mouseup", function () { pointerUp(); });

  restartBtn.addEventListener("click", function () {
    startGame();
  });

  window.addEventListener("resize", resize);

  // ---- game flow ----
  function startGame() {
    gates = [];
    score = 0;
    elapsed = 0;
    spawnTimer = 1.5;
    blob.r = BLOB_START_R;
    blob.y = height / 2;
    particles = []; // cosmetic reset
    shakeTime = 0;  // cosmetic reset
    gameState = "playing";
    overlay.classList.add("hidden");
    updateHud();
  }

  function endGame() {
    triggerShake(10, 0.35); // cosmetic
    spawnParticles(blob.x, blob.y, "#ff3d5e", 16); // cosmetic
    spawnParticles(blob.x, blob.y, "#c73dff", 10); // cosmetic
    beep(90, 0.28, "sawtooth", 0.09); // cosmetic
    gameState = "over";
    if (score > best) {
      best = score;
      try {
        if (window.localStorage) window.localStorage.setItem("pinchPointBest", String(best));
      } catch (e) { /* ignore */ }
    }
    overlayTitle.textContent = "Squeezed!";
    overlayText.innerHTML = "Score: " + score + "<br>Best: " + best;
    overlayText2.textContent = "Tap Play Again to retry.";
    restartBtn.classList.remove("hidden");
    overlay.classList.remove("hidden");
    updateHud();
  }

  function updateHud() {
    scoreLine.textContent = "Score: " + score;
    bestLine.textContent = "Best: " + best;
  }

  function spawnGate() {
    var t = difficultyT();
    var gapMax = lerp(GAP_HALF_MAX_START, GAP_HALF_MAX_END, t);
    var gapMin = lerp(GAP_HALF_MIN_START, GAP_HALF_MIN_END, t);
    var gapHalf = lerp(gapMin, gapMax, Math.random());
    var lo = gapHalf + GAP_EDGE_MARGIN;
    var hi = height - gapHalf - GAP_EDGE_MARGIN;
    var gapY;
    if (hi <= lo) {
      gapY = height / 2;
    } else {
      gapY = lerp(lo, hi, Math.random());
    }
    gates.push({
      x: width + GATE_WIDTH,
      gapY: gapY,
      gapHalf: gapHalf,
      passed: false,
      paletteIdx: Math.floor(Math.random() * GATE_COLOR_PALETTES.length) // cosmetic only
    });
  }

  function update(dt) {
    if (gameState !== "playing") return;
    elapsed += dt;

    var t = difficultyT();
    var speed = lerp(GATE_SPEED_START, GATE_SPEED_MAX, t);
    var spawnInterval = lerp(SPAWN_INTERVAL_START, SPAWN_INTERVAL_MIN, t);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnGate();
      spawnTimer += spawnInterval;
    }

    for (var i = gates.length - 1; i >= 0; i--) {
      var g = gates[i];
      g.x -= speed * dt;

      var overlapsX = (blob.x + blob.r > g.x) && (blob.x - blob.r < g.x + GATE_WIDTH);
      if (overlapsX) {
        var topOk = blob.y - blob.r >= g.gapY - g.gapHalf;
        var botOk = blob.y + blob.r <= g.gapY + g.gapHalf;
        if (!topOk || !botOk) {
          endGame();
          return;
        }
      }

      if (!g.passed && (blob.x - blob.r) > (g.x + GATE_WIDTH)) {
        g.passed = true;
        score += 10 + Math.round(blob.r / 2);
        updateHud();
        spawnParticles(blob.x, blob.y, "#6dfad0", 6); // cosmetic
        spawnParticles(blob.x, blob.y, "#ffcf6b", 6); // cosmetic
        beep(560, 0.09, "sine", 0.05); // cosmetic
      }

      if (g.x + GATE_WIDTH < -10) {
        gates.splice(i, 1);
      }
    }
  }

  // ---- rendering (presentation only; reads game state, never mutates it) ----
  function render() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(shakeOffX, shakeOffY);

    // background
    ctx.fillStyle = bgGradient || "#0e1a3a";
    ctx.fillRect(-30, -30, width + 60, height + 60);

    // distant drifting color orbs (soft, blurred via gradient falloff, very slow motion)
    for (var oI = 0; oI < orbs.length; oI++) {
      var orb = orbs[oI];
      var ox = orb.fx * width + Math.sin(cosmeticTime * orb.speed + orb.phase) * 26;
      var oy = orb.fy * height + Math.cos(cosmeticTime * orb.speed * 0.8 + orb.phase) * 18;
      var orbGrad = ctx.createRadialGradient(ox, oy, 0, ox, oy, orb.r);
      orbGrad.addColorStop(0, orb.color + "33");
      orbGrad.addColorStop(1, orb.color + "00");
      ctx.fillStyle = orbGrad;
      ctx.fillRect(ox - orb.r, oy - orb.r, orb.r * 2, orb.r * 2);
    }

    // twinkling background stars (mixed warm/cool dots for texture)
    for (var sI = 0; sI < stars.length; sI++) {
      var star = stars[sI];
      var tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(cosmeticTime * star.speed + star.phase));
      ctx.globalAlpha = tw * 0.7;
      ctx.fillStyle = star.warm ? "#ffcf6b" : "#c9d8ff";
      ctx.beginPath();
      ctx.arc(star.fx * width, star.fy * height, star.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // gates: warm coral/gold gradient walls (per-gate hue variety) with a glowing
    // edge along the gap ("pinch" sensor line)
    for (var i = 0; i < gates.length; i++) {
      var g = gates[i];
      var topH = g.gapY - g.gapHalf;
      var botY = g.gapY + g.gapHalf;
      var pal = GATE_COLOR_PALETTES[g.paletteIdx || 0];
      var wallGrad = ctx.createLinearGradient(g.x, 0, g.x + GATE_WIDTH, 0);
      wallGrad.addColorStop(0, pal[0]);
      wallGrad.addColorStop(1, pal[1]);
      ctx.shadowColor = pal[2];
      ctx.shadowBlur = 16;
      ctx.fillStyle = wallGrad;
      ctx.fillRect(g.x, 0, GATE_WIDTH, Math.max(0, topH));
      ctx.fillRect(g.x, botY, GATE_WIDTH, Math.max(0, height - botY));
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 2;
      if (topH > 0) {
        ctx.beginPath();
        ctx.moveTo(g.x, topH);
        ctx.lineTo(g.x + GATE_WIDTH, topH);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(g.x, botY);
      ctx.lineTo(g.x + GATE_WIDTH, botY);
      ctx.stroke();
    }

    // blob: gradient that shifts from cool mint (small/safe) toward warm gold
    // (large/risky) as it grows, so its color itself reads as a size cue,
    // plus a thin gauge ring showing pinch size precisely.
    var radiusT = clamp((blob.r - BLOB_MIN_R) / (BLOB_MAX_R - BLOB_MIN_R), 0, 1);
    var blobMid = lerpColor("#6dfad0", "#ffcf6b", radiusT);
    var blobDeep = lerpColor("#189a82", "#ff9a3d", radiusT);
    var blobGrad = ctx.createRadialGradient(
      blob.x - blob.r * 0.3, blob.y - blob.r * 0.3, Math.max(1, blob.r * 0.1),
      blob.x, blob.y, blob.r
    );
    blobGrad.addColorStop(0, "#fbfff8");
    blobGrad.addColorStop(0.55, blobMid);
    blobGrad.addColorStop(1, blobDeep);
    ctx.shadowColor = radiusT < 0.5 ? "rgba(109, 250, 208, 0.6)" : "rgba(255, 154, 61, 0.6)";
    ctx.shadowBlur = 22;
    ctx.fillStyle = blobGrad;
    ctx.beginPath();
    ctx.arc(blob.x, blob.y, blob.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(blob.x, blob.y, blob.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * radiusT);
    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();

    // particles (collision burst / gate-pass sparkle)
    for (var p = 0; p < particles.length; p++) {
      var particle = particles[p];
      var pt = 1 - particle.age / particle.life;
      ctx.globalAlpha = Math.max(0, pt);
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, particle.r * pt, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // vignette (fixed, not affected by shake)
    if (vignetteGradient) {
      ctx.fillStyle = vignetteGradient;
      ctx.fillRect(0, 0, width, height);
    }
  }

  var lastTime = null;
  function loop(now) {
    if (lastTime === null) lastTime = now;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    update(dt);
    updateCosmetics(dt); // visuals only: particles + screen shake decay
    render();

    requestAnimationFrame(loop);
  }

  resize();
  blob.y = height / 2;
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
